version: '3.8'

services:
  neko:
    image: m1k1o/neko:latest
    restart: unless-stopped
    environment:
      - NEKO_PASSWORD=neko
      - NEKO_PASSWORD_ADMIN=admin
      - NEKO_EPR=52000-52100
      - NEKO_ICELITE=1
      - NEKO_NAT1TO1=your_public_ip
      - NEKO_SCREEN=1920x1080@30
      - NEKO_LOCKS=control,screen,audio,video,clipboard,display,keyboard,mouse
    ports:
      - "8080:8080"
      - "52000-52100:52000-52100/udp"
    volumes:
      - neko_data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

volumes:
  neko_data:
    driver: local
