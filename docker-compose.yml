version: "3.8"
services:
  neko:
    image: "ghcr.io/m1k1o/neko/chromium:latest"
    restart: "unless-stopped"
    shm_size: "2gb"
    ports:
      - "8081:8080"
      - "52000-52100:52000-52100/udp"
    environment:
      NEKO_DESKTOP_SCREEN: 1920x1080@30
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: neko
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: admin
      NEKO_START_URL: https://youtube.com
      NEKO_LOCKED: false
      NEKO_PASSWORD: ""
      NEKO_LOGIN_SCREEN: false
      # Simple configuration for iframe access
      NEKO_EPR: 52000-52100
      NEKO_ICELITE: 1
      # Disable complex features for iframe
      NEKO_VIDEO: false
      NEKO_AUDIO: false
      NEKO_CLIPBOARD: false
      # See: https://neko.m1k1o.net/docs/v3/configuration/webrtc#ip
      # NEKO_NAT1TO1: <IP_ADDRESS>
